splits:
  frozen_train_name: train
  frozen_heldout_name: dev
  heldout_allocation:
    architecture_dev: 0.40
    calibration: 0.30
    teacher_forced_test: 0.30
  stratify_by: [source_bucket]
  grouping_key: production_problem_group

representation:
  name: final_transformer_layer_checkpoint_final_token_v1
  source_layout: three_layer_checkpoint_final_with_difference_and_trace_summary_v1
  layer: -1
  training_dtype: float32
  storage_dtype: float16

training:
  architectures: [linear_probe, local_mlp, change_aware_mlp, causal_gru]
  baseline_architectures: [position_only]
  learning_rates: [0.001, 0.0003]
  position_only_learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  max_epochs: 50
  patience: 7
  batch_size_traces: 64
  hidden_width: 128
  dropout: 0.1

calibration:
  kind: positive_affine_logistic
  max_iterations: 500

evaluation:
  ece_bins: 10
  bootstrap_replicates: 500
  bootstrap_seed: 1701
  threshold_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]

guards:
  require_exactly_four_rollouts: true
  forbid_native_inputs: true
  forbid_first_error_target: true
  forbid_calibrated_architecture_selection: true
  forbid_test_architecture_selection: true
  freeze_final_tau: false
