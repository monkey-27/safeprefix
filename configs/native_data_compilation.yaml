include: [models.yaml, datasets.yaml]

experiment:
  id: safeprefix_native_data_compilation_v1
  status: historical_deprecated
  superseded_by: configs/native_failed_trace_acquisition.yaml
artifacts_root: artifacts/native_data_compilation
seed: 2701
selected_models: [family_a_small, family_a_large, family_b_small, family_b_large]

models:
  family_a_small:
    max_context_length: 32768
    selected_hidden_state_layers: [18, 27, -1]
  family_a_large:
    max_context_length: 32768
    selected_hidden_state_layers: [14, 21, -1]
  family_b_small:
    max_context_length: 131072
    selected_hidden_state_layers: [14, 21, -1]
    chat_template_kwargs: {date_string: "26 Jul 2026"}
  family_b_large:
    max_context_length: 131072
    selected_hidden_state_layers: [16, 24, -1]
    chat_template_kwargs: {date_string: "26 Jul 2024"}

frozen_native_manifest:
  source_configuration_hash: d205b4ddf267dad17d18c81c61e7ef9419ad689d72d28f742b771756d9a70423
  file: /workspace/frozen/native_configuration_development.jsonl
  sha256: 249e0d8bbe60f882091a7a9da14b1b4a33faec43826196e2b6a2dcbd44508e4a
  expected_rows: 900
  expected_unique_problem_groups: 900
  expected_bucket_counts:
    gsm8k: 100
    math_level: 200
    olympiad_or_omnimath: 400
    hard_synthetic_arithmetic: 200
  protected_identity_file: /workspace/frozen/protected_problem_groups.json
  final_test_outputs_may_be_opened: false

native_data_compilation:
  schema_version: 1
  data_compilation_only: true
  full_inference_authorized: false
  boundary_training_enabled: false
  checkpoint_scoring_enabled: false
  repair_generation_enabled: false
  final_test_access_enabled: false
  target_initial_failures_per_model: 120
  maximum_attempts_per_model: 900
  failure_selection: earliest_failed_parseable_trace_in_frozen_manifest_order
  bucket_failure_quotas: null
  attempt_pack_size: 12
  representation_extraction: posthoc_teacher_force_exact_saved_native_tokens
  teacher_force_chunk_size: 256
  store_full_kv_cache: false
  store_full_token_hidden_states: false
  exact_once_key: [model_key, problem_group_hash, initial_generation_seed]
  rollout_exact_once_key: [model_key, trace_id, rollout_index]
  four_from_scratch_rollouts: true
  initial_trace_is_not_a_rollout: true

production_execution:
  dtype: bf16
  attention_backend: sdpa
  require_resolved_attention_backend: sdpa
  cache_protocol: complete_cache_saved_next_logits_no_replay
  microbatch_policy: dynamic_unpadded
  deterministic_branch_rng: true
  torch_compile: false
  branch_batch_sizes:
    family_a_small: 64
    family_a_large: 32
    family_b_small: 24
    family_b_large: 16

# P0 and hybrid are the concrete path inherited by the most recent production
# configs. They remain provisional because Phase A did not pass its selection
# gate. Engineering smokes may exercise this path; a full native launch remains
# blocked until that scientific configuration discrepancy is resolved.
prompting:
  condition: P0
  selection_status: provisional_inherited_from_production_config
  answer_format: boxed
segmenter:
  name: hybrid
  min_tokens: 24
  max_tokens: 64
  selection_status: provisional_phase_a_gate_not_passed

generation:
  initial:
    temperature: 0.7
    top_p: 0.95
    top_k: 0
    max_new_tokens: 2048
  from_scratch:
    temperature: 0.7
    top_p: 0.95
    top_k: 0
    max_new_tokens: 4096
  base_seed: 2701
  rollout_indices: [0, 1, 2, 3]
  seed_derivation: stable_seed_base_model_problem_role_index_v1

parser:
  name: deterministic_boxed_fallbacks
  version: safeprefix_answer_parser_v2
verifier:
  name: exact_answer
  version: safeprefix_exact_answer_v1
  absolute_tolerance: 1.0e-6
  relative_tolerance: 1.0e-6

smoke:
  enabled: true
  maximum_attempts_per_model: 8
  maximum_failures_per_model: 1
  initial_max_new_tokens: 768
  rollout_max_new_tokens: 256
  require_parseable_incorrect_initial_trace: true
  require_four_rollouts: true
  require_hidden_state_file: true
  require_resume_validation: true
  preferred_bucket_order: [olympiad_or_omnimath, math_level, hard_synthetic_arithmetic, gsm8k]

launch_gates:
  full_inference_requires_explicit_user_approval: true
  full_inference_currently_blocked: true
  blockers:
    - phase_a_prompt_parser_segmenter_gate_not_passed
    - per_bucket_failed_trace_quotas_not_frozen
  smoke_permitted: true
