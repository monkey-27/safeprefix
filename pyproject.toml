[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safeprefix-code"
version = "0.1.0"
description = "SafePrefix: verifier-safe prefix restoration and suffix regeneration experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.10,<2",
  "datasets>=5,<6",
  "huggingface-hub>=0.34,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<25",
  "PyYAML>=6,<7",
  "rapidfuzz>=3.9,<4",
  "scikit-learn>=1.5,<2",
  "scipy>=1.12,<2",
  "torch>=2.6,<3",
  "transformers>=4.55,<5",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
cloud = ["modal>=1.4,<2"]
dev = ["pytest>=8,<9"]

[project.scripts]
safeprefix = "safeprefix.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["safeprefix*"]

